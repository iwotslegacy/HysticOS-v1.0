<style>

*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Inter,system-ui,sans-serif;color:#f5f6ff;background:#101936;overflow:hidden}button,input,textarea,select{font:inherit}button{border:1px solid #ffffff1a;background:#ffffff12;color:inherit;border-radius:10px;padding:9px 12px;cursor:pointer;transition:.16s}button:hover{background:#ffffff25;transform:translateY(-1px)}input,textarea,select{background:#0e1428;color:#fff;border:1px solid #ffffff24;border-radius:9px;padding:10px;outline:none}input:focus,textarea:focus{border-color:var(--accent)}.hidden{display:none!important}
#login{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:radial-gradient(ellipse at 25% 20%,#5d54c7 0,transparent 38%),linear-gradient(135deg,#0c142c,#17152f 55%,#071a2d)}.login-card{width:min(420px,92vw);padding:34px;border:1px solid #ffffff2a;background:#11182bd9;backdrop-filter:blur(28px);border-radius:24px;box-shadow:0 28px 90px #0008}.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:25px;letter-spacing:-.7px}.logo-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#40d9ff);font-size:24px}.login-card p{color:#b8c0dc}.login-card form{display:grid;gap:12px;margin-top:22px}.login-card input{padding:13px}.login-actions{display:flex;justify-content:space-between;align-items:center;margin-top:15px;color:#bfc6df;font-size:13px}.primary{background:var(--accent);border-color:transparent;color:white}.primary:hover{filter:brightness(1.12);background:var(--accent)}#desktop{position:fixed;inset:0;background:radial-gradient(ellipse at 70% 10%,#6559c8 0,transparent 34%),radial-gradient(ellipse at 10% 90%,#176c86 0,transparent 38%),linear-gradient(135deg,var(--wall1),var(--wall2));background-size:cover}.desktop-icons{position:absolute;top:20px;left:18px;display:grid;gap:14px}.desk-icon{width:82px;text-align:center;padding:9px 3px;border-radius:12px;cursor:pointer;font-size:12px;text-shadow:0 1px 4px #000}.desk-icon:hover{background:#ffffff20}.desk-icon .emoji{font-size:30px;display:block;margin-bottom:6px}.window{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(850px,90vw);height:min(570px,78vh);min-width:310px;min-height:240px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.4);border:1px solid #ffffff30;border-radius:16px;box-shadow:0 25px 80px #0006;overflow:hidden;display:flex;flex-direction:column;resize:both}.window.active{box-shadow:0 30px 100px #0008,0 0 0 1px #ffffff20}.titlebar{height:47px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:#ffffff08;cursor:move;border-bottom:1px solid #ffffff16}.win-title{font-size:13px;font-weight:650;display:flex;gap:9px;align-items:center}.win-controls{display:flex;gap:5px}.win-controls button{padding:4px 10px;border:0;background:transparent}.win-controls .close:hover{background:#e84c65}.win-body{padding:16px;overflow:auto;flex:1;background:#0d1224a8}.taskbar{position:absolute;bottom:0;left:0;right:0;height:var(--task);display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 12px;background:#111827bb;backdrop-filter:blur(24px);border-top:1px solid #ffffff22;z-index:500}.task-left{position:absolute;left:14px;display:flex;gap:7px}.task-right{position:absolute;right:14px;display:flex;align-items:center;gap:10px;font-size:12px}.task-apps{display:flex;align-items:center;gap:7px}.task-app{height:43px;min-width:43px;border-radius:12px;display:grid;place-items:center;font-size:21px;position:relative}.task-app.running:after{content:"";position:absolute;bottom:3px;width:14px;height:3px;border-radius:3px;background:#8bd9ff}.task-app.active{background:#ffffff2a}.start-menu{position:absolute;bottom:calc(var(--task) + 12px);left:50%;transform:translateX(-50%);width:min(570px,94vw);max-height:75vh;overflow:auto;background:#151c30f2;backdrop-filter:blur(30px);border:1px solid #ffffff26;border-radius:22px;padding:22px;z-index:600;box-shadow:0 20px 70px #0008}.start-top{display:flex;gap:10px;margin-bottom:18px}.app-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}.app-tile{padding:15px 6px;text-align:center;border-radius:12px;cursor:pointer}.app-tile:hover{background:#ffffff16}.app-tile .emoji{display:block;font-size:27px;margin-bottom:7px}.app-tile small{color:#b9c2df}.section-title{font-size:12px;color:#aeb9d8;text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px}.card{background:#ffffff0b;border:1px solid #ffffff16;border-radius:14px;padding:15px;margin-bottom:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}.muted{color:#aeb8d4}.small{font-size:12px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:#c1c9e1}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.big-number{font-size:30px;font-weight:750}.app-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.store-app{background:#ffffff0b;border:1px solid #ffffff16;border-radius:14px;padding:15px}.store-app .emoji{font-size:30px}.code{width:100%;height:100%;resize:none;font:13px/1.55 Consolas,monospace;white-space:pre;tab-size:2}.terminal{font:13px/1.6 Consolas,monospace;color:#b4f6d0;white-space:pre-wrap}.term-line{display:flex;gap:7px;font:13px Consolas,monospace}.term-line input{flex:1;border:0;background:transparent;padding:2px;color:#b4f6d0}.file-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:9px}.file-row:hover{background:#ffffff10}.file-row .file-icon{font-size:23px}.file-row button{margin-left:auto}.pill{font-size:11px;background:#ffffff13;padding:4px 8px;border-radius:20px;color:#c6cee7}.game-canvas{width:100%;max-height:350px;background:#090d1c;border-radius:12px;image-rendering:pixelated}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc-display{width:100%;font-size:28px;text-align:right;margin-bottom:12px}.calc button{font-size:18px;padding:15px 5px}.media-preview{width:100%;max-height:300px;background:#05070d;border-radius:10px}.toast{position:absolute;bottom:calc(var(--task) + 18px);right:18px;background:#172039ed;border:1px solid #ffffff2b;padding:12px 16px;border-radius:12px;z-index:900;box-shadow:0 10px 30px #0005}.range{width:100%}#desktop.task-small{--task:48px}#desktop.task-large{--task:78px}@media(max-width:600px){.task-left{display:none}.task-right{font-size:10px;right:8px}.taskbar{justify-content:flex-start;padding-left:10px}.task-apps{margin-left:0}.task-app{min-width:38px;height:38px}.window{width:96vw;height:78vh}.grid2{grid-template-columns:1fr}.desktop-icons{grid-template-columns:repeat(2,82px)}}
</style></head>
<body>
<div id="login"><div class="login-card"><div class="logo"><span class="logo-mark">✦</span> HysticOS</div><p id="auth-sub">A smoother place to start.</p><form id="auth-form"><input id="auth-user" autocomplete="username" placeholder="Username" required minlength="2" maxlength="24"><input id="auth-pass" type="password" autocomplete="current-password" placeholder="Password" required minlength="4"><button class="primary" id="auth-submit">Sign in</button></form><div class="login-actions"><span id="auth-error">Demo accounts stay in this browser.</span><button id="auth-switch">Create account</button></div></div></div>
<div id="desktop" class="hidden"><div class="desktop-icons" id="desktop-icons"></div><div id="windows"></div><div class="start-menu hidden" id="start-menu"><div class="start-top"><input id="app-search" class="grow" placeholder="Search apps and games…"><button id="power-btn">⏻</button></div><div class="section-title">Pinned</div><div class="app-grid" id="start-apps"></div><div class="section-title">Recommended · Hystic Store</div><div id="recommended"></div></div><div class="taskbar"><div class="task-left"><button id="weather">☀ 18°</button></div><div class="task-apps"><button class="task-app" id="start-btn" title="Start">✦</button><button class="task-app" data-open="store" title="Hystic Store">🛍️</button><button class="task-app" data-open="browser" title="Browser">🌐</button><button class="task-app" data-open="files" title="Files">📁</button><button class="task-app" data-open="settings" title="Settings">⚙️</button><div id="running-apps" class="task-apps"></div></div><div class="task-right"><span id="net-status">● Online</span><span id="clock"></span></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const APPS={
store:{name:'Hystic Store',icon:'🛍️',desc:'Discover apps and games'},
terminal:{name:'Terminal',icon:'⌨️',desc:'Command line'},
code:{name:'Code Studio',icon:'🧑‍💻',desc:'Build tiny web apps'},
files:{name:'File Explorer',icon:'📁',desc:'Browse your files'},
settings:{name:'Settings',icon:'⚙️',desc:'Personalize HysticOS'},
notepad:{name:'Notepad',icon:'📝',desc:'Write and save notes'},
calculator:{name:'Calculator',icon:'🧮',desc:'Quick calculations'},
music:{name:'Music Player',icon:'🎵',desc:'Play your audio files'},
video:{name:'Video Player',icon:'🎬',desc:'Watch your videos'},
browser:{name:'Web Browser',icon:'🌐',desc:'Browse websites'},
recorder:{name:'Screen Recorder',icon:'🔴',desc:'Record your screen'},
taskmgr:{name:'Task Manager',icon:'📊',desc:'See running apps'},
snake:{name:'Neon Snake',icon:'🐍',desc:'Arcade game · beat your best'},
orbit:{name:'Orbit Defender',icon:'🚀',desc:'Survive waves of asteroids'},
clicker:{name:'Crystal Clicker',icon:'💎',desc:'Build your crystal empire'}
};
const GAMES=['snake','orbit','clicker']; let user=null,authMode='login',z=10,winCount=0,files=[],installed=new Set(['store','terminal','code','files','settings','notepad','calculator','music','video','browser','recorder','taskmgr','snake','orbit','clicker']),running=new Map(),activeId=null;
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem('hystic_'+k))??d}catch{return d}},write=(k,v)=>localStorage.setItem('hystic_'+k,JSON.stringify(v));
files=read('files',[]); let notes=read('notes','Welcome to HysticOS!\n\nYour ideas start here.');let settings=read('settings',{accent:'#7c6cff',wall1:'#101936',wall2:'#39266c',task:'normal'});
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2800)}
function saveFiles(){write('files',files)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function authUI(){ $('#auth-sub').textContent=authMode==='login'?'Sign in to your Hystic desktop.':'Create a local HysticOS profile.';$('#auth-submit').textContent=authMode==='login'?'Sign in':'Create account';$('#auth-switch').textContent=authMode==='login'?'Create account':'Back to sign in';$('#auth-error').textContent='Browser-only demo account storage.';$('#auth-pass').autocomplete=authMode==='login'?'current-password':'new-password'}
$('#auth-switch').onclick=()=>{authMode=authMode==='login'?'signup':'login';authUI()};
$('#auth-form').onsubmit=e=>{e.preventDefault();let name=$('#auth-user').value.trim(),pass=$('#auth-pass').value;let users=read('users',{});if(authMode==='signup'){if(users[name])return $('#auth-error').textContent='That username already exists.';users[name]={pass};write('users',users);user=name;startOS()}else{if(!users[name]||users[name].pass!==pass)return $('#auth-error').textContent='Incorrect username or password.';user=name;startOS()}};
function startOS(){$('#login').classList.add('hidden');$('#desktop').classList.remove('hidden');$('#desktop-icons').innerHTML=['store','files','notepad','snake','settings'].map(id=>`<div class="desk-icon" data-open="${id}"><span class="emoji">${APPS[id].icon}</span>${APPS[id].name}</div>`).join('');applySettings();renderStart();toast('Welcome back, '+user+'!');}
function applySettings(){document.documentElement.style.setProperty('--accent',settings.accent);$('#desktop').style.setProperty('--wall1',settings.wall1);$('#desktop').style.setProperty('--wall2',settings.wall2);$('#desktop').classList.toggle('task-small',settings.task==='small');$('#desktop').classList.toggle('task-large',settings.task==='large')}
function renderStart(filter=''){$('#start-apps').innerHTML=[...installed].filter(id=>APPS[id]&&APPS[id].name.toLowerCase().includes(filter.toLowerCase())).map(id=>`<div class="app-tile" data-open="${id}"><span class="emoji">${APPS[id].icon}</span>${APPS[id].name}</div>`).join('');$('#recommended').innerHTML=`<div class="row"><span>🎮</span><div class="grow"><b>Arcade collection</b><div class="small muted">Three games, local high scores</div></div><button data-open="store">Explore</button></div>`}
$('#app-search').oninput=e=>renderStart(e.target.value);$('#start-btn').onclick=()=>$('#start-menu').classList.toggle('hidden');$('#power-btn').onclick=()=>{if(confirm('Sign out of HysticOS?'))location.reload()};
document.addEventListener('click',e=>{let b=e.target.closest('[data-open]');if(b)openApp(b.dataset.open);if(!e.target.closest('#start-menu')&&!e.target.closest('#start-btn')&&!e.target.closest('[data-open]'))$('#start-menu').classList.add('hidden')});
$$('[data-open]').forEach(b=>b.onclick=()=>openApp(b.dataset.open));
function openApp(id){if(!APPS[id])return;if(!installed.has(id)&&id!=='store'){toast('Install this app from Hystic Store first.');openApp('store');return}$('#start-menu').classList.add('hidden');if(running.has(id)){let el=running.get(id);el.classList.remove('hidden');el.style.zIndex=++z;activeId=id;return}
const w=document.createElement('section');w.className='window';w.dataset.app=id;w.style.zIndex=++z;w.style.left=(50+(winCount%5-2)*2)+'%';w.style.top=(48+(winCount%4-1)*2)+'%';winCount++;
w.innerHTML=`<div class="titlebar"><div class="win-title"><span>${APPS[id].icon}</span>${APPS[id].name}</div><div class="win-controls"><button class="min">—</button><button class="max">□</button><button class="close">✕</button></div></div><div class="win-body" id="body-${id}"></div>`;
$('#windows').append(w);running.set(id,w);activeId=id;w.onpointerdown=()=>{w.style.zIndex=++z;activeId=id};w.querySelector('.close').onclick=()=>{w.remove();running.delete(id);renderRunning()};w.querySelector('.min').onclick=()=>w.classList.add('hidden');w.querySelector('.max').onclick=()=>{if(w.dataset.max==='1'){w.style.width='min(850px,90vw)';w.style.height='min(570px,78vh)';w.style.left='50%';w.style.top='48%';w.dataset.max='0'}else{w.style.width='calc(100vw - 20px)';w.style.height='calc(100vh - var(--task) - 20px)';w.style.left='50%';w.style.top='calc((100vh - var(--task))/2)';w.dataset.max='1'}};
drag(w,w.querySelector('.titlebar'));renderRunning();renderApp(id,$('#body-'+id));
}
function drag(w,bar){let start=null;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;start={x:e.clientX,y:e.clientY,l:w.offsetLeft,t:w.offsetTop};w.style.transform='none';bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!start)return;w.style.left=(start.l+e.clientX-start.x)+'px';w.style.top=(start.t+e.clientY-start.y)+'px'});bar.addEventListener('pointerup',()=>start=null)}
function renderRunning(){$('#running-apps').innerHTML=[...running.keys()].map(id=>`<button class="task-app running ${id===activeId?'active':''}" data-focus="${id}" title="${APPS[id].name}">${APPS[id].icon}</button>`).join('');$$('[data-focus]').forEach(b=>b.onclick=()=>{let w=running.get(b.dataset.focus);w.classList.remove('hidden');w.style.zIndex=++z;activeId=b.dataset.focus})}
function renderApp(id,el){const field=(label,html)=>`<div class="field"><label>${label}</label>${html}</div>`;
if(id==='store'){el.innerHTML=`<h2>Hystic Store</h2><p class="muted">Small apps, big possibilities. Install instantly.</p><div class="app-list">${Object.entries(APPS).filter(([k])=>k!=='store').map(([k,a])=>`<div class="store-app"><div class="emoji">${a.icon}</div><h3>${a.name}</h3><p class="small muted">${a.desc}</p><button data-install="${k}" ${installed.has(k)?'disabled':''}>${installed.has(k)?'✓ Installed':'Install'}</button></div>`).join('')}</div>`;$$('[data-install]',el).forEach(b=>b.onclick=()=>{installed.add(b.dataset.install);write('installed',[...installed]);toast(APPS[b.dataset.install].name+' installed');renderApp('store',el);renderStart()});}
if(id==='settings'){el.innerHTML=`<h2>Settings</h2><div class="card"><h3>Personalization</h3><div class="grid2">${field('Accent color',`<input type="color" id="accent" value="${settings.accent}">`)}${field('Wallpaper · deep tone',`<input type="color" id="wall1" value="${settings.wall1}">`)}${field('Wallpaper · glow tone',`<input type="color" id="wall2" value="${settings.wall2}">`)}${field('Taskbar size',`<select id="task-size"><option value="small">Compact</option><option value="normal">Default</option><option value="large">Large</option></select>`)}</div><button class="primary" id="apply-settings">Apply appearance</button></div><div class="card"><h3>Account</h3><p>Signed in as <b>${escapeHtml(user||'Guest')}</b></p><button id="signout">Sign out</button></div><div class="card"><h3>Credits</h3><p><b>@iwotslegacy</b> — Creator / Developer</p><p><b>@phillycheese704</b> — Inspired</p><p class="muted small">HysticOS is an independent browser desktop project.</p></div><div class="card"><h3>About</h3><p>HysticOS Web · Build 1.0 · HTML, CSS and JavaScript</p><p class="muted small">GitHub Pages edition. Browser data is local to this browser.</p></div>`;$('#task-size').value=settings.task;$('#apply-settings').onclick=()=>{settings={accent:$('#accent').value,wall1:$('#wall1').value,wall2:$('#wall2').value,task:$('#task-size').value};write('settings',settings);applySettings();toast('Appearance updated')};$('#signout').onclick=()=>location.reload();}
if(id==='notepad'){el.innerHTML=`<div class="row"><h2 class="grow">Notepad</h2><button id="save-note" class="primary">Save note</button><button id="download-note">Export .txt</button></div><textarea id="note-text" style="width:100%;height:calc(100% - 65px);min-height:240px;resize:none" placeholder="Start writing…">${escapeHtml(notes)}</textarea><p class="small muted">Autosaves in this browser when you press Save.</p>`;$('#save-note').onclick=()=>{notes=$('#note-text').value;write('notes',notes);toast('Note saved')};$('#download-note').onclick=()=>download('note.txt',$('#note-text').value,'text/plain')}
if(id==='calculator'){el.innerHTML=`<input class="calc-display" id="calc-display" value="0" readonly><div class="calc">${['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].map(x=>`<button data-calc="${x}" ${x==='='?'class="primary"':''}>${x}</button>`).join('')}</div>`;let d=$('#calc-display'),expr='';$$('[data-calc]',el).forEach(b=>b.onclick=()=>{let x=b.dataset.calc;if(x==='C')expr='';else if(x==='⌫')expr=expr.slice(0,-1);else if(x==='='){try{let safe=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');if(!/^[0-9+*/().\-\s]+$/.test(safe))throw 0;expr=String(Function('"use strict";return ('+safe+')')())}catch{expr='Error'}}else if(x==='±')expr=expr.startsWith('-')?expr.slice(1):'-'+expr;else expr+=x;d.value=expr||'0'})}
if(id==='files'){el.innerHTML=`<div class="row"><h2 class="grow">File Explorer</h2><button id="upload-file">＋ Import file</button><input id="file-input" type="file" multiple class="hidden"></div><div class="row" id="file-tabs"><button data-folder="All files">All files</button><button data-folder="Downloads">Downloads</button><button data-folder="Documents">Documents</button><button data-folder="Media">Media</button></div><div class="section-title" id="folder-name">All files</div><div id="file-list"></div><p class="small muted">Imported file names are remembered locally. Large file contents are not uploaded anywhere.</p>`;let folder='All files';const draw=()=>{$('#folder-name').textContent=folder;let arr=files.filter(f=>folder==='All files'||f.folder===folder||folder==='Media'&&f.type.startsWith('media/'));$('#file-list').innerHTML=arr.length?arr.map(f=>`<div class="file-row"><span class="file-icon">${f.type.startsWith('image/')?'🖼️':f.type.startsWith('video/')?'🎬':f.type.startsWith('audio/')?'🎵':'📄'}</span><div class="grow"><b>${escapeHtml(f.name)}</b><div class="small muted">${f.folder} · ${f.size}</div></div><button data-del="${f.id}">Delete</button></div>`).join(''):'<p class="muted">This folder is empty. Import a file to get started.</p>';$$('[data-del]',el).forEach(b=>b.onclick=()=>{files=files.filter(f=>f.id!==b.dataset.del);saveFiles();draw()})};$$('[data-folder]',el).forEach(b=>b.onclick=()=>{folder=b.dataset.folder;draw()});$('#upload-file').onclick=()=>$('#file-input').click();$('#file-input').onchange=e=>{[...e.target.files].forEach(f=>files.push({id:crypto.randomUUID(),name:f.name,type:f.type||'application/octet-stream',size:(f.size/1024).toFixed(1)+' KB',folder:/\.(mp3|wav|ogg|mp4|webm|mov|png|jpg|jpeg|gif)$/i.test(f.name)?'Media':/\.(txt|md|pdf|docx?)$/i.test(f.name)?'Documents':'Downloads'}));saveFiles();draw();toast('Imported file metadata')};draw()}
if(id==='music'||id==='video'){let accept=id==='music'?'audio/*':'video/*';el.innerHTML=`<h2>${APPS[id].name}</h2><div class="card"><input type="file" id="media-file" accept="${accept}"><p class="muted small">Choose a file from your device. Playback happens locally in your browser.</p><div id="media-name" class="muted"></div></div><video id="media-player" class="media-preview ${id==='music'?'hidden':''}" controls></video><audio id="audio-player" class="media-preview ${id==='video'?'hidden':''}" controls></audio>`;$('#media-file').onchange=e=>{let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f),p=id==='music'?$('#audio-player'):$('#media-player');p.src=url;p.classList.remove('hidden');$('#media-name').textContent=f.name;p.play().catch(()=>{})}}
if(id==='browser'){el.innerHTML=`<h2>Web Browser</h2><form id="browse-form" class="row"><input id="browse-url" class="grow" placeholder="https://example.com" value="https://example.com"><button class="primary">Go</button><button type="button" id="new-tab">Open new tab ↗</button></form><p class="small muted">Some websites block embedding. If a page refuses to load, use Open new tab.</p><iframe id="web-frame" title="Browser frame" style="width:100%;height:calc(100% - 105px);min-height:250px;border:1px solid #ffffff20;border-radius:12px;background:white" referrerpolicy="no-referrer"></iframe>`;const url=()=>{let s=$('#browse-url').value.trim();if(!/^https?:\\/\\//i.test(s))s='https://'+s;return s};$('#browse-form').onsubmit=e=>{e.preventDefault();$('#web-frame').src=url()};$('#new-tab').onclick=()=>window.open(url(),'_blank','noopener,noreferrer');$('#web-frame').src='https://example.com'}
if(id==='terminal'){el.innerHTML=`<div class="terminal" id="term-output">HysticOS Terminal [Version 1.0]\nType 'help' to see available commands.\n\n</div><form id="term-form" class="term-line"><span>hystic@${escapeHtml(user||'guest')}:~$</span><input id="term-input" autocomplete="off" spellcheck="false" autofocus></form>`;let out=$('#term-output');const print=s=>out.textContent+=s+'\n';$('#term-form').onsubmit=e=>{e.preventDefault();let raw=$('#term-input').value.trim();$('#term-input').value='';if(!raw)return;print('hystic@'+user+':~$ '+raw);let [cmd,...args]=raw.split(' ');switch(cmd.toLowerCase()){case'help':print('help, clear, date, whoami, uname, ls, pwd, echo, neofetch, apps, open <app>, install <app>, calc <expression>, theme <hex>, note <text>, uptime, matrix, fortune, exit');break;case'clear':out.textContent='';break;case'date':print(new Date().toString());break;case'whoami':print(user||'guest');break;case'uname':print('HysticOS Web 1.0 browser-kernel x86_64');break;case'pwd':print('/home/'+(user||'guest'));break;case'ls':print('Desktop  Documents  Downloads  Music  Videos  Apps');break;case'echo':print(args.join(' '));break;case'neofetch':print('✦ HysticOS\\n  OS: HysticOS Web\\n  Shell: Hystic Terminal\\n  User: '+user+'\\n  Apps: '+installed.size+' installed\\n  Theme: '+settings.accent);break;case'apps':print([...installed].map(k=>APPS[k].name).join(' · '));break;case'open':{let key=args.join(' ').toLowerCase(),found=Object.keys(APPS).find(k=>k===key||APPS[k].name.toLowerCase()===key);if(found)openApp(found);else print('App not found. Try: '+Object.keys(APPS).join(', '));break}case'install':{let key=args.join(' ').toLowerCase();if(APPS[key]){installed.add(key);write('installed',[...installed]);print(key+' installed.')}else print('Unknown app. Visit Hystic Store.');break}case'calc':try{let x=args.join(' ');if(!/^[0-9+*/().% -]+$/.test(x))throw 0;print(String(Function('return ('+x+')')()))}catch{print('Invalid expression')}break;case'theme':if(/^#[0-9a-f]{6}$/i.test(args[0]||'')){settings.accent=args[0];write('settings',settings);applySettings();print('Accent updated.')}else print('Usage: theme #7c6cff');break;case'note':notes+=(notes?'\\n':'')+args.join(' ');write('notes',notes);print('Note appended.');break;case'uptime':print('This session has been running in your browser.');break;case'matrix':print(Array.from({length:8},()=>Array.from({length:30},()=>Math.random()>.5?'1':'0').join('')).join('\\n'));break;case'fortune':print(['Great things are built one small feature at a time.','The best shortcut is the one you understand.','Today is a good day to ship something.'][Math.floor(Math.random()*3)]);break;case'exit':wClose(id);break;default:print('Command not found: '+cmd+'. Type help.')}out.scrollTop=out.scrollHeight};}
if(id==='code'){el.innerHTML=`<div class="row"><h2 class="grow">Code Studio</h2><button id="run-code" class="primary">▶ Run preview</button><button id="save-code">Save .html</button></div><div class="grid2" style="height:calc(100% - 70px)"><textarea id="code-text" class="code"><!doctype html>\n<html><body style="font-family:system-ui;background:#10182c;color:white;padding:30px">\n<h1>Hello, HysticOS!</h1>\n<p>Build something cool.</p>\n<button onclick="document.querySelector('p').textContent='It works!'">Click me</button>\n</body></html></textarea><iframe id="code-preview" sandbox="allow-scripts" style="width:100%;height:100%;background:white;border:0;border-radius:10px"></iframe></div><p class="small muted">Runs in a sandboxed preview. Don't paste code you don't trust.</p>`;$('#run-code').onclick=()=>$('#code-preview').srcdoc=$('#code-text').value;$('#save-code').onclick=()=>download('hystic-app.html',$('#code-text').value,'text/html');$('#run-code').click()}
if(id==='taskmgr'){el.innerHTML=`<h2>Task Manager</h2><div class="grid2"><div class="card"><div class="muted">Running apps</div><div class="big-number" id="tm-count">0</div></div><div class="card"><div class="muted">Installed apps</div><div class="big-number">${installed.size}</div></div></div><div id="tm-list"></div><button id="tm-refresh">Refresh</button>`;const draw=()=>{$('#tm-count').textContent=running.size;$('#tm-list').innerHTML=[...running.keys()].map(k=>`<div class="file-row"><span class="file-icon">${APPS[k].icon}</span><div class="grow"><b>${APPS[k].name}</b><div class="small muted">Running · Browser process</div></div><button data-end="${k}">End task</button></div>`).join('')||'<p class="muted">No running apps.</p>';$$('[data-end]').forEach(b=>b.onclick=()=>{if(b.dataset.end===id){toast('Cannot end Task Manager from itself.');return}running.get(b.dataset.end)?.remove();running.delete(b.dataset.end);renderRunning();draw()})};$('#tm-refresh').onclick=draw;draw()}
if(id==='recorder'){el.innerHTML=`<h2>Screen Recorder</h2><div class="card"><p>Record a screen, window, or browser tab. Your browser will ask what to share.</p><div class="row"><button class="primary" id="record-start">● Start recording</button><button id="record-stop" disabled>■ Stop</button><span id="record-status" class="pill">Ready</span></div><video id="record-preview" class="media-preview" controls></video><a id="record-download" class="hidden" download="hysticos-recording.webm">Download recording</a></div><p class="small muted">Screen capture requires HTTPS or localhost and your permission.</p>`;let stream,rec,chunks=[];$('#record-start').onclick=async()=>{try{stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'}),url=URL.createObjectURL(blob);$('#record-preview').src=url;$('#record-download').href=url;$('#record-download').classList.remove('hidden');$('#record-status').textContent='Recording saved'};rec.start();$('#record-status').textContent='Recording…';$('#record-start').disabled=true;$('#record-stop').disabled=false}catch(e){toast('Screen recording cancelled or unavailable')}};$('#record-stop').onclick=()=>{if(rec&&rec.state!=='inactive')rec.stop();stream?.getTracks().forEach(t=>t.stop());$('#record-start').disabled=false;$('#record-stop').disabled=true}}

function wClose(id){running.get(id)?.remove();running.delete(id);renderRunning()}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function renderSnake(el){let best=read('snakebest',0);el.innerHTML=`<div class="row"><h2 class="grow">Neon Snake</h2><span class="pill">WASD / arrows</span><span>Score: <b id="snake-score">0</b> · Best: <b id="snake-best">${best}</b></span></div><canvas class="game-canvas" id="snake-canvas" width="480" height="320"></canvas><div class="row" style="margin-top:10px"><button class="primary" id="snake-start">Start / Restart</button><span class="muted small">Eat the glowing orbs. Don't hit walls or yourself!</span></div><div class="row" style="justify-content:center"><button data-dir="up">↑</button></div><div class="row" style="justify-content:center"><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div>`;let c=$('#snake-canvas'),ctx=c.getContext('2d'),snake,food,dir,next,score=0,timer,alive=false;const reset=()=>{snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];dir={x:1,y:0};next=dir;score=0;alive=true;food={x:15,y:8};$('#snake-score').textContent=score;clearInterval(timer);timer=setInterval(tick,115);draw()};function draw(){ctx.fillStyle='#090d1c';ctx.fillRect(0,0,480,320);ctx.strokeStyle='#ffffff0b';for(let x=0;x<480;x+=16){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,320);ctx.stroke()}for(let y=0;y<320;y+=16){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(480,y);ctx.stroke()}ctx.fillStyle='#ff5cbd';ctx.shadowBlur=15;ctx.shadowColor='#ff5cbd';ctx.beginPath();ctx.arc(food.x*16+8,food.y*16+8,6,0,7);ctx.fill();ctx.shadowBlur=0;snake?.forEach((p,i)=>{ctx.fillStyle=i?'#43d9c0':'#a9fff2';ctx.fillRect(p.x*16+1,p.y*16+1,14,14)})}function tick(){if(!alive)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=30||h.y>=20||snake.some(p=>p.x===h.x&&p.y===h.y)){alive=false;clearInterval(timer);toast('Game over · Score '+score);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;$('#snake-score').textContent=score;if(score>read('snakebest',0)){write('snakebest',score);$('#snake-best').textContent=score}do{food={x:Math.floor(Math.random()*30),y:Math.floor(Math.random()*20)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}else snake.pop();draw()}function setdir(d){let v={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[d];if(v&&!(v.x===-dir.x&&v.y===-dir.y))next=v}$('#snake-start').onclick=reset;$$('[data-dir]',el).forEach(b=>b.onclick=()=>setdir(b.dataset.dir));const key=e=>{if(['ArrowUp','w','W'].includes(e.key))setdir('up');if(['ArrowDown','s','S'].includes(e.key))setdir('down');if(['ArrowLeft','a','A'].includes(e.key))setdir('left');if(['ArrowRight','d','D'].includes(e.key))setdir('right')};window.addEventListener('keydown',key);el.closest('.window').querySelector('.close').addEventListener('click',()=>{clearInterval(timer);window.removeEventListener('keydown',key)});reset()}
function renderOrbit(el){el.innerHTML=`<div class="row"><h2 class="grow">Orbit Defender</h2><span>Score: <b id="orbit-score">0</b> · Lives: <b id="orbit-lives">3</b></span></div><canvas class="game-canvas" id="orbit-canvas" width="520" height="320"></canvas><div class="row"><button class="primary" id="orbit-start">Launch mission</button><span class="small muted">Move with ← → or A/D. Space to fire. Survive the asteroid waves.</span></div>`;let c=$('#orbit-canvas'),ctx=c.getContext('2d'),ship,rocks,shots,score,lives,keys={},timer,alive=false;function start(){ship={x:260,y:275};rocks=[];shots=[];score=0;lives=3;alive=true;$('#orbit-score').textContent=0;$('#orbit-lives').textContent=3;clearInterval(timer);timer=setInterval(tick,30)}function tick(){ctx.fillStyle='#070b19';ctx.fillRect(0,0,520,320);for(let i=0;i<65;i++){ctx.fillStyle='#ffffff55';ctx.fillRect((i*79)%520,(i*47+score)%320,1.5,1.5)}if(keys.ArrowLeft||keys.a)ship.x-=5;if(keys.ArrowRight||keys.d)ship.x+=5;ship.x=Math.max(12,Math.min(508,ship.x));ctx.fillStyle='#58e7ff';ctx.beginPath();ctx.moveTo(ship.x,ship.y-13);ctx.lineTo(ship.x-11,ship.y+10);ctx.lineTo(ship.x+11,ship.y+10);ctx.fill();if(Math.random()<.035)rocks.push({x:Math.random()*510+5,y:-10,r:6+Math.random()*10,v:1.3+Math.random()*2});if(keys[' ']){if(!shots.length||shots[shots.length-1].y<ship.y-50)shots.push({x:ship.x,y:ship.y-15})}shots.forEach(s=>{s.y-=7;ctx.fillStyle='#ffdf7e';ctx.fillRect(s.x-2,s.y,4,10)});rocks.forEach(r=>{r.y+=r.v;ctx.strokeStyle='#ff7a9d';ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();shots.forEach((s,i)=>{if(Math.hypot(r.x-s.x,r.y-s.y)<r.r+5){r.dead=true;s.dead=true;score+=10;$('#orbit-score').textContent=score}});if(Math.hypot(r.x-ship.x,r.y-ship.y)<r.r+10){r.dead=true;lives--;$('#orbit-lives').textContent=lives;if(lives<=0){alive=false;clearInterval(timer);toast('Mission ended · Score '+score)}}});rocks=rocks.filter(r=>!r.dead&&r.y<340);shots=shots.filter(s=>!s.dead&&s.y>0)}const keydown=e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()},keyup=e=>keys[e.key]=false;window.addEventListener('keydown',keydown);window.addEventListener('keyup',keyup);$('#orbit-start').onclick=start;el.closest('.window').querySelector('.close').addEventListener('click',()=>{clearInterval(timer);window.removeEventListener('keydown',keydown);window.removeEventListener('keyup',keyup)});start()}
function renderClicker(el){let data=read('clicker',{crystals:0,power:1,auto:0});el.innerHTML=`<div class="row"><h2 class="grow">Crystal Clicker</h2><span class="pill">Idle empire</span></div><div class="card" style="text-align:center"><div class="big-number" id="crystals">${Math.floor(data.crystals).toLocaleString()}</div><div class="muted">crystals</div><button id="mine" style="font-size:70px;background:transparent;border:0;transition:transform .1s">💎</button><p>Tap the crystal to mine. Buy upgrades to grow faster.</p></div><div class="grid2"><div class="card"><h3>⛏️ Better pickaxe</h3><p class="muted small">+1 crystal per tap</p><p>Cost: <b id="pick-cost">${data.power*50}</b></p><button id="pick" class="primary">Upgrade pickaxe</button></div><div class="card"><h3>🤖 Crystal bot</h3><p class="muted small">+1 crystal per second per bot</p><p>Cost: <b id="bot-cost">${100+data.auto*100}</b></p><button id="bot" class="primary">Buy bot</button></div></div><button id="save-crystal">Save progress</button>`;function update(){ $('#crystals').textContent=Math.floor(data.crystals).toLocaleString();$('#pick-cost').textContent=data.power*50;$('#bot-cost').textContent=100+data.auto*100;$('#pick').disabled=data.crystals<data.power*50;$('#bot').disabled=data.crystals<100+data.auto*100;write('clicker',data)}$('#mine').onclick=()=>{data.crystals+=data.power;$('#mine').style.transform='scale(.92)';setTimeout(()=>$('#mine').style.transform='',90);update()};$('#pick').onclick=()=>{let cost=data.power*50;if(data.crystals>=cost){data.crystals-=cost;data.power++;update()}};$('#bot').onclick=()=>{let cost=100+data.auto*100;if(data.crystals>=cost){data.crystals-=cost;data.auto++;update()}};$('#save-crystal').onclick=()=>{write('clicker',data);toast('Progress saved')};let timer=setInterval(()=>{data.crystals+=data.auto;update()},1000);el.closest('.window').querySelector('.close').addEventListener('click',()=>clearInterval(timer));update()}
setInterval(()=>{let d=new Date();$('#clock').innerHTML=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'<br>'+d.toLocaleDateString([], {day:'2-digit',month:'short'});},1000);
if('serviceWorker'in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
const savedInstalled=read('installed',null);if(savedInstalled)installed=new Set(savedInstalled);
